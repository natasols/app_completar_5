<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calcumat Pre-Kínder – ¿Cuántas hay en el dado?</title>

<style>

body{
    font-family:'Comic Sans MS','Trebuchet MS',sans-serif;
    margin:0;
    text-align:center;
    background:white;
}

/* CONTENEDOR */
.wrapper{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
}

/* FLECHAS */
.flecha-nav{
    position:absolute;
    top:18px;
    display:flex;
    align-items:center;
    gap:6px;
    font-size:16px;
    color:#9e9e9e;
    cursor:pointer;
    user-select:none;
    transition:0.2s;
}

.flecha-nav:hover{
    color:#616161;
    transform:scale(1.05);
}

.flecha-nav span{
    font-size:22px;
}

.flecha-indice{ left:24px; }
.flecha-inicio{ right:24px; }

/* HEADERS */
.header-portada{
    margin-top:55px;
}

.header-app{
    margin-top:14px;
}

.logo-portada{
    width:360px;
}

.logo-app{
    width:150px;
}

.logo-manos{
    width:150px;
}

/* TEXTOS */
h1{
    font-size:36px;
    margin:22px 0 8px 0;
}

h2{
    font-size:30px;
    margin:10px 0 6px 0;
}

.bajada{
    font-size:24px;
    margin-top:0;
}

.contador{
    font-size:18px;
    margin-top:4px;
}

/* MAIN */
.main{
    flex:1;
    width:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:5px 0;
}

/* ZONA CENTRAL */
.contenedor{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:80px;
    margin:30px 0;
    min-height:210px;
}

/* DADO */
.dado{
    width:160px;
    height:160px;
    border:4px solid black;
    border-radius:25px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
}

.punto{
    width:28px;
    height:28px;
    background:black;
    border-radius:50%;
    margin:auto;
}

/* MANOS */
.zona-manos{
    width:160px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.manos{
    width:130px;
}

.espejo{
    transform:scaleX(-1);
}

/* NUMERO */
.resultado{
    width:110px;
    text-align:center;
    font-size:110px;
    color:#e53935;
    line-height:1;
}

/* FOOTER */
.footer{
    width:100%;
    min-height:90px;
    padding:5px 0 20px 0;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
}

.boton{
    padding:14px 28px;
    font-size:20px;
    background:#4CAF50;
    color:white;
    border:none;
    border-radius:12px;
    cursor:pointer;
}

.reloj{
    font-size:56px;
}

.oculto{
    visibility:hidden;
}

@media (max-height:750px){

    .logo-app,
    .logo-manos{
        width:120px;
    }

    h2{
        font-size:26px;
        margin:6px 0 4px 0;
    }

    .contador{
        font-size:16px;
    }

    .contenedor{
        gap:50px;
        margin:18px 0;
        min-height:180px;
    }

    .dado{
        width:130px;
        height:130px;
    }

    .punto{
        width:23px;
        height:23px;
    }

    .manos{
        width:105px;
    }

    .resultado{
        font-size:88px;
        width:90px;
    }

    .footer{
        min-height:75px;
        padding-bottom:12px;
    }
}

</style>
</head>

<body>

<div id="app"></div>

<script>

/* NAVEGACIÓN */
function volverIndice(){
    window.location.href = "index_pre_kinder.html";
}

function volverInicio(){
    mostrarPortada();
}

/* VOZ */
function hablar(texto){
    let msg = new SpeechSynthesisUtterance(texto);
    msg.lang = "es-CL";

    let voces = speechSynthesis.getVoices();
    let voz = voces.find(v => v.lang.includes("es"));

    if(voz) msg.voice = voz;

    speechSynthesis.cancel();
    speechSynthesis.speak(msg);
}

/* VARIABLES */
let numero = 0;
let ejercicio = 0;
let total = 10;

/* DADO */
function generarDado(n){
    let posiciones = {
        1:[5],
        2:[1,9],
        3:[1,5,9],
        4:[1,3,7,9],
        5:[1,3,5,7,9],
        6:[1,3,4,6,7,9]
    };

    let html = "";

    for(let i=1;i<=9;i++){
        html += posiciones[n].includes(i)
            ? `<div class="punto"></div>`
            : `<div></div>`;
    }

    return html;
}

/* MANOS */
function obtenerManos(n){

    if(n === 6){
        return `
            <img src="mano_3.png" class="manos espejo">
            <img src="mano_3.png" class="manos">
        `;
    }

    return `<img src="mano_${n}.png" class="manos">`;
}

/* PORTADA */
function mostrarPortada(){

    speechSynthesis.cancel();

    document.getElementById("app").innerHTML = `
        <div class="wrapper">

            <div class="flecha-nav flecha-indice" onclick="volverIndice()">
                <span>←</span> Índice
            </div>

            <div class="header-portada">
                <img src="logo.png" class="logo-portada">
                <h1>¿Cuántas hay en el dado?</h1>
                <div class="bajada">Cuantificar de súbito hasta 6.</div>
            </div>

            <div class="main"></div>

            <div class="footer">
                <button class="boton" onclick="iniciar()">Iniciar</button>
            </div>

        </div>
    `;
}

/* INICIO */
function iniciar(){
    ejercicio = 0;
    siguienteEjercicio();
}

/* EJERCICIO */
function siguienteEjercicio(){

    ejercicio++;

    if(ejercicio > total){
        mostrarFinal();
        return;
    }

    numero = Math.floor(Math.random()*6)+1;

    document.getElementById("app").innerHTML = `
        <div class="wrapper">

            <div class="flecha-nav flecha-indice" onclick="volverIndice()">
                <span>←</span> Índice
            </div>

            <div class="flecha-nav flecha-inicio" onclick="volverInicio()">
                <span>↻</span> Inicio
            </div>

            <div class="header-app">
                <img src="logo_manos.png" class="logo-manos">
                <h2>¿Cuántos puntos hay?</h2>
                <div class="contador">Ejercicio ${ejercicio} de ${total}</div>
            </div>

            <div class="main">
                <div class="contenedor">
                    <div id="zonaManos" class="zona-manos"></div>
                    <div id="dado" class="dado"></div>
                    <div id="numero" class="resultado"></div>
                </div>
            </div>

            <div id="botonera" class="footer">
                <button class="boton" onclick="iniciarEjercicio()">Iniciar ejercicio</button>
            </div>

        </div>
    `;
}

/* ANIMACIÓN */
function animarDado(final){
    let dado = document.getElementById("dado");
    let cambios = 0;

    let intervalo = setInterval(() => {
        let r = Math.floor(Math.random()*6)+1;
        dado.innerHTML = generarDado(r);

        cambios++;

        if(cambios > 10){
            clearInterval(intervalo);
            dado.innerHTML = generarDado(final);
        }
    },80);
}

/* INICIAR */
function iniciarEjercicio(){

    animarDado(numero);

    document.getElementById("botonera").innerHTML = `
        <div class="reloj">⏳</div>
    `;

    setTimeout(ocultar,3000);
}

/* OCULTAR */
function ocultar(){

    document.getElementById("dado").classList.add("oculto");

    document.getElementById("botonera").innerHTML = `
        <button class="boton" onclick="verificar()">Verificar</button>
    `;
}

/* VERIFICAR */
function verificar(){

    document.getElementById("dado").classList.remove("oculto");

    document.getElementById("numero").innerText = numero;
    document.getElementById("zonaManos").innerHTML = obtenerManos(numero);

    hablar("Hay " + numero);

    document.getElementById("botonera").innerHTML = `
        <button class="boton" onclick="siguienteEjercicio()">Siguiente</button>
    `;
}

/* FINAL */
function mostrarFinal(){

    document.getElementById("app").innerHTML = `
        <div class="wrapper">

            <div class="flecha-nav flecha-indice" onclick="volverIndice()">
                <span>←</span> Índice
            </div>

            <div class="flecha-nav flecha-inicio" onclick="volverInicio()">
                <span>↻</span> Inicio
            </div>

            <div class="header-portada">
                <img src="logo.png" class="logo-portada">
                <h1>¡Muy bien!</h1>
            </div>

            <div class="main"></div>

            <div class="footer">
                <button class="boton" onclick="mostrarPortada()">Volver</button>
            </div>

        </div>
    `;
}

/* START */
mostrarPortada();

</script>

</body>
</html>
