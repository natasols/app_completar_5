<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calcumat Pre-Kínder – ¿Cuántas hay en la cinta?</title>

<style>

body{
    font-family:'Comic Sans MS','Trebuchet MS',sans-serif;
    margin:0;
    text-align:center;
    background:white;
}

/* CONTENEDOR */
.wrapper{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
}

/* FLECHAS */
.flecha-nav{
    position:absolute;
    top:18px;
    display:flex;
    align-items:center;
    gap:6px;
    font-size:16px;
    color:#9e9e9e;
    cursor:pointer;
    user-select:none;
    transition:0.2s;
}

.flecha-nav:hover{
    color:#616161;
    transform:scale(1.05);
}

.flecha-nav span{
    font-size:22px;
}

.flecha-indice{ left:24px; }
.flecha-inicio{ right:24px; }

/* HEADERS */
.header-portada{ margin-top:55px; }
.header-app{ margin-top:14px; }

.logo-portada{ width:360px; }
.logo-app{ width:150px; }
.logo-manos{ width:150px; }

/* TEXTOS */
h1{
    font-size:36px;
    margin:22px 0 8px 0;
}

h2{
    font-size:30px;
    margin:10px 0 6px 0;
}

.bajada{
    font-size:24px;
    margin-top:0;
}

.contador{
    font-size:18px;
    margin-top:4px;
}

/* MAIN */
.main{
    flex:1;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:5px 0;
}

/* FILA PUNTOS */
.fila-puntos{
    display:grid;
    grid-template-columns:repeat(6,80px);
    justify-content:center;
    margin-bottom:20px;
}

/* CINTA */
.cinta{
    display:grid;
    grid-template-columns:repeat(6,80px);
    justify-content:center;
}

/* CASILLAS */
.casilla{
    width:80px;
    height:80px;
    border:2px solid black;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    position:relative;
}

/* PUNTOS */
.punto{
    width:70px;
    height:70px;
    border-radius:50%;
    background:red;
}

/* RESPUESTA */
.correcto::after{
    content:"";
    position:absolute;
    width:70px;
    height:70px;
    border:3px solid #4CAF50;
    border-radius:50%;
}

/* FOOTER */
.footer{
    width:100%;
    min-height:90px;
    padding:5px 0 20px 0;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
}

.boton{
    padding:14px 28px;
    font-size:20px;
    background:#4CAF50;
    color:white;
    border:none;
    border-radius:12px;
    cursor:pointer;
}

.reloj{
    font-size:56px;
}

.oculto{
    visibility:hidden;
}

@media (max-height:750px){

    .logo-app,
    .logo-manos{
        width:120px;
    }

    h2{
        font-size:26px;
        margin:6px 0 4px 0;
    }

    .contador{
        font-size:16px;
    }

    .fila-puntos{
        grid-template-columns:repeat(6,68px);
        margin-bottom:14px;
    }

    .cinta{
        grid-template-columns:repeat(6,68px);
    }

    .casilla{
        width:68px;
        height:68px;
        font-size:24px;
    }

    .punto{
        width:58px;
        height:58px;
    }

    .correcto::after{
        width:58px;
        height:58px;
    }

    .footer{
        min-height:75px;
        padding-bottom:12px;
    }
}

</style>
</head>

<body>

<div id="pantalla"></div>

<script>

/* NAVEGACIÓN */
function volverIndice(){
    window.location.href = "index_pre_kinder.html";
}

function volverInicio(){
    portada();
}

/* VOZ */
let vocesDisponibles = [];

speechSynthesis.onvoiceschanged = () => {
    vocesDisponibles = speechSynthesis.getVoices();
};

function hablar(texto){
    let m = new SpeechSynthesisUtterance(texto);
    m.lang = "es-CL";
    m.rate = 0.9;

    let voz = vocesDisponibles.find(v =>
        v.lang.includes("es") &&
        v.name.toLowerCase().includes("google")
    );

    if(voz) m.voice = voz;

    speechSynthesis.cancel();
    speechSynthesis.speak(m);
}

/* VARIABLES */
let cantidad = 0;
let ejercicio = 0;
let total = 20;

/* PORTADA */
function portada(){
    speechSynthesis.cancel();

    document.getElementById("pantalla").innerHTML = `
        <div class="wrapper">

            <div class="flecha-nav flecha-indice" onclick="volverIndice()">
                <span>←</span> Índice
            </div>

            <div class="header-portada">
                <img src="logo.png" class="logo-portada">
                <h1>¿Cuántas hay en la cinta?</h1>
                <div class="bajada">Cuantificar en la cinta numerada hasta 6 · Parte 1</div>
            </div>

            <div class="main"></div>

            <div class="footer">
                <button class="boton" onclick="iniciar()">Iniciar</button>
            </div>

        </div>
    `;
}

/* INICIO */
function iniciar(){
    ejercicio = 0;
    nuevoEjercicio();
}

/* NUEVO EJERCICIO */
function nuevoEjercicio(){

    ejercicio++;

    if(ejercicio > total){
        mostrarFinal();
        return;
    }

    cantidad = Math.floor(Math.random()*6)+1;

    document.getElementById("pantalla").innerHTML = `
        <div class="wrapper">

            <div class="flecha-nav flecha-indice" onclick="volverIndice()">
                <span>←</span> Índice
            </div>

            <div class="flecha-nav flecha-inicio" onclick="volverInicio()">
                <span>↻</span> Inicio
            </div>

            <div class="header-app">
                <img src="logo_manos.png" class="logo-manos">
                <h2>¿Cuántas hay?</h2>
                <div class="contador">Ejercicio ${ejercicio} de ${total}</div>
            </div>

            <div class="main">
                <div id="puntos"></div>
                <div id="cinta"></div>
            </div>

            <div id="botonera" class="footer">
                <button class="boton" onclick="iniciarEjercicio()">Iniciar ejercicio</button>
            </div>

        </div>
    `;

    hablar("¿Cuántas hay?");
}

/* INICIAR */
function iniciarEjercicio(){

    let puntos = document.getElementById("puntos");
    let cinta = document.getElementById("cinta");

    puntos.className = "fila-puntos";
    cinta.className = "cinta";

    puntos.innerHTML = "";
    cinta.innerHTML = "";

    for(let i=1;i<=6;i++){

        let cont = document.createElement("div");

        if(i<=cantidad){
            let p = document.createElement("div");
            p.className="punto";
            cont.appendChild(p);
        }

        puntos.appendChild(cont);

        let cas = document.createElement("div");
        cas.className="casilla";
        cas.id="num"+i;
        cas.innerText=i;

        cinta.appendChild(cas);
    }

    document.getElementById("botonera").innerHTML = `
        <div class="reloj">⏳</div>
    `;

    setTimeout(ocultarTodo,3000);
}

/* OCULTAR */
function ocultarTodo(){

    document.getElementById("puntos").classList.add("oculto");
    document.getElementById("cinta").classList.add("oculto");

    document.getElementById("botonera").innerHTML = `
        <button class="boton" onclick="mostrarRespuesta()">Verificar</button>
    `;
}

/* VERIFICAR */
function mostrarRespuesta(){

    document.getElementById("puntos").classList.remove("oculto");
    document.getElementById("cinta").classList.remove("oculto");

    let correcto = document.getElementById("num"+cantidad);
    correcto.classList.add("correcto");

    hablar("Hay " + cantidad);

    document.getElementById("botonera").innerHTML = `
        <button class="boton" onclick="nuevoEjercicio()">Siguiente</button>
    `;
}

/* FINAL */
function mostrarFinal(){

    document.getElementById("pantalla").innerHTML = `
        <div class="wrapper">

            <div class="flecha-nav flecha-indice" onclick="volverIndice()">
                <span>←</span> Índice
            </div>

            <div class="flecha-nav flecha-inicio" onclick="volverInicio()">
                <span>↻</span> Inicio
            </div>

            <div class="header-portada">
                <img src="logo.png" class="logo-portada">
                <h1>¡Muy bien!</h1>
            </div>

            <div class="main"></div>

            <div class="footer">
                <button class="boton" onclick="portada()">Volver</button>
            </div>

        </div>
    `;

    hablar("Muy bien");
}

/* START */
portada();

</script>

</body>
</html>
