<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calcumat Kinder – ¿Cuántas hay? ¿Cuántas faltan?</title>

<style>

body{
    font-family:'Comic Sans MS','Trebuchet MS',sans-serif;
    margin:0;
    text-align:center;
    background:white;
}

/* CONTENEDOR */
.wrapper{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
}

/* FLECHAS */
.flecha-nav{
    position:absolute;
    top:18px;
    display:flex;
    align-items:center;
    gap:6px;
    font-size:16px;
    color:#9e9e9e;
    cursor:pointer;
    user-select:none;
    transition:0.2s;
}

.flecha-nav:hover{
    color:#616161;
    transform:scale(1.05);
}

.flecha-nav span{
    font-size:22px;
}

.flecha-indice{
    left:24px;
}

.flecha-inicio{
    right:24px;
}

/* HEADERS */
.header-portada{
    margin-top:55px;
}

.header-app{
    margin-top:14px;
}

.logo-portada{
    width:360px;
}

.logo-app{
    width:150px;
}

/* TEXTOS */
h1{
    font-size:36px;
    margin:22px 0 8px 0;
}

h2{
    font-size:30px;
    margin:10px 0 6px 0;
}

.bajada{
    font-size:24px;
    margin-top:0;
}

.contador{
    font-size:18px;
    margin-top:4px;
}

/* MAIN */
.main{
    flex:1;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:5px 0;
}

/* MARCO */
.marco{
    display:grid;
    grid-template-columns: repeat(5,100px);
    grid-template-rows: repeat(2,100px);
    border:4px solid #0d2b45;
}

.casilla{
    display:flex;
    justify-content:center;
    align-items:center;
    border-right:2px solid #0d2b45;
    border-bottom:2px solid #0d2b45;
}

.casilla:nth-child(5),
.casilla:nth-child(10){
    border-right:none;
}

.casilla:nth-child(n+6){
    border-bottom:none;
}

.punto{
    width:80px;
    height:80px;
    border-radius:50%;
    background:#f44336;
}

.verde{
    background:#4CAF50;
}

/* TEXTO */
.numero{
    font-size:90px;
    margin-top:20px;
}

.rojo{
    color:#e53935;
}

.verde-texto{
    color:#4CAF50;
}

.expresion{
    font-size:50px;
    margin-top:10px;
}

/* FOOTER */
.footer{
    width:100%;
    min-height:90px;
    padding:5px 0 20px 0;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
}

.boton{
    padding:14px 28px;
    font-size:20px;
    background:#4CAF50;
    color:white;
    border:none;
    border-radius:12px;
    cursor:pointer;
}

.reloj{
    font-size:56px;
}

.oculto{
    visibility:hidden;
}

@media (max-height:750px){

    .logo-app{
        width:120px;
    }

    h2{
        font-size:26px;
        margin:6px 0 4px 0;
    }

    .contador{
        font-size:16px;
    }

    .marco{
        grid-template-columns: repeat(5,82px);
        grid-template-rows: repeat(2,82px);
    }

    .punto{
        width:65px;
        height:65px;
    }

    .numero{
        font-size:78px;
        margin-top:12px;
    }

    .expresion{
        font-size:38px;
        margin-top:6px;
    }

    .footer{
        min-height:75px;
        padding-bottom:12px;
    }
}

</style>
</head>

<body>

<div id="app"></div>

<script>

/* NAVEGACIÓN */
function volverIndice(){
    window.location.href = "index_kinder.html";
}

function volverInicio(){
    mostrarPortada();
}

/* VOZ */
function hablar(texto){
    let msg = new SpeechSynthesisUtterance(texto);
    msg.lang = "es-CL";
    let voz = speechSynthesis.getVoices().find(v => v.lang.includes("es"));
    if(voz) msg.voice = voz;
    speechSynthesis.cancel();
    speechSynthesis.speak(msg);
}

let cantidad = 0;
let faltan = 0;
let ejercicio = 0;
let total = 20;
let anterior = -1;

/* PORTADA */
function mostrarPortada(){

    speechSynthesis.cancel();

    document.getElementById("app").innerHTML = `
        <div class="wrapper">

            <div class="flecha-nav flecha-indice" onclick="volverIndice()">
                <span>←</span> Índice
            </div>

            <div class="header-portada">
                <img src="logo.png" class="logo-portada">

                <h1>¿Cuántas hay? ¿Cuántas faltan?</h1>

                <div class="bajada">
                    Cuantificar de súbito hasta 10 - cuantificar lo que falta para completar 10
                </div>
            </div>

            <div class="main"></div>

            <div class="footer">
                <button class="boton" onclick="iniciar()">Iniciar</button>
            </div>

        </div>
    `;
}

function iniciar(){
    ejercicio = 0;
    siguienteEjercicio();
}

function siguienteEjercicio(){

    ejercicio++;

    if(ejercicio > total){
        mostrarFinal();
        return;
    }

    do{
        cantidad = Math.floor(Math.random()*4)+6;
    }while(cantidad === anterior);

    anterior = cantidad;
    faltan = 10 - cantidad;

    document.getElementById("app").innerHTML = `
        <div class="wrapper">

            <div class="flecha-nav flecha-indice" onclick="volverIndice()">
                <span>←</span> Índice
            </div>

            <div class="flecha-nav flecha-inicio" onclick="volverInicio()">
                <span>↻</span> Inicio
            </div>

            <div class="header-app">
                <img src="logo.png" class="logo-app">
                <h2 id="pregunta">¿Cuántas hay?</h2>
                <div class="contador">Ejercicio ${ejercicio} de ${total}</div>
            </div>

            <div class="main">
                <div id="marco" class="marco oculto"></div>
                <div id="numero" class="numero"></div>
                <div id="expresion" class="expresion"></div>
            </div>

            <div id="footer" class="footer">
                <button class="boton" onclick="mostrarEjercicio()">Iniciar ejercicio</button>
            </div>

        </div>
    `;
}

/* MOSTRAR */
function mostrarEjercicio(){

    let marco = document.getElementById("marco");
    marco.innerHTML = "";
    marco.classList.remove("oculto");

    let arriba = Array(5).fill(0);
    let abajo = Array(5).fill(0);

    let extra = cantidad - 5;
    let arribaCompleta = Math.random() < 0.5;

    if(arribaCompleta){
        arriba = Array(5).fill(1);
        for(let i=0;i<extra;i++) abajo[i]=1;
    }else{
        abajo = Array(5).fill(1);
        for(let i=0;i<extra;i++) arriba[i]=1;
    }

    let distribucion = arriba.concat(abajo);

    distribucion.forEach(v=>{
        let div = document.createElement("div");
        div.className="casilla";
        if(v===1){
            div.innerHTML='<div class="punto"></div>';
        }
        marco.appendChild(div);
    });

    document.getElementById("footer").innerHTML = `<div class="reloj">⏳</div>`;

    setTimeout(ocultar,3000);
}

/* OCULTAR */
function ocultar(){

    document.getElementById("marco").classList.add("oculto");

    document.getElementById("footer").innerHTML = `
        <button class="boton" onclick="mostrarCantidad()">¿Cuántas hay?</button>
    `;
}

/* CUÁNTAS HAY */
function mostrarCantidad(){

    document.getElementById("marco").classList.remove("oculto");

    document.getElementById("numero").innerText = cantidad;
    document.getElementById("numero").className = "numero rojo";

    hablar("Hay " + cantidad);

    document.getElementById("pregunta").innerText = "¿Cuántas faltan para completar 10?";

    document.getElementById("footer").innerHTML = `
        <button class="boton" onclick="mostrarFaltan()">¿Cuántas faltan para completar 10?</button>
    `;
}

/* CUÁNTAS FALTAN */
function mostrarFaltan(){

    let casillas = document.querySelectorAll(".casilla");

    let contador = 0;

    for(let i=0;i<casillas.length;i++){
        if(casillas[i].innerHTML==="" && contador < faltan){
            casillas[i].innerHTML = '<div class="punto verde"></div>';
            contador++;
        }
    }

    document.getElementById("numero").innerText = "";
    document.getElementById("numero").innerText = faltan;
    document.getElementById("numero").className = "numero verde-texto";

    document.getElementById("expresion").innerText = `faltan ${faltan}`;

    hablar("Faltan " + faltan);

    setTimeout(()=>{
        document.getElementById("expresion").innerText = `${cantidad} y ${faltan} hacen 10`;
        hablar(`${cantidad} y ${faltan} hacen 10`);
    },1000);

    document.getElementById("footer").innerHTML = `
        <button class="boton" onclick="siguienteEjercicio()">Siguiente</button>
    `;
}

/* FINAL */
function mostrarFinal(){

    document.getElementById("app").innerHTML = `
        <div class="wrapper">

            <div class="flecha-nav flecha-indice" onclick="volverIndice()">
                <span>←</span> Índice
            </div>

            <div class="flecha-nav flecha-inicio" onclick="volverInicio()">
                <span>↻</span> Inicio
            </div>

            <div class="header-portada">
                <img src="logo.png" class="logo-portada">
                <h1>¡Muy bien!</h1>
            </div>

            <div class="main"></div>

            <div class="footer">
                <button class="boton" onclick="mostrarPortada()">Volver</button>
            </div>

        </div>
    `;
}

mostrarPortada();

</script>

</body>
</html>
