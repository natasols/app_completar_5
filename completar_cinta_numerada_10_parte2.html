<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calcumat Kinder – Completar cinta numerada · Parte 2</title>

<style>
body{
    font-family:'Comic Sans MS','Trebuchet MS',sans-serif;
    margin:0;
    text-align:center;
    background:white;
}

.wrapper{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
}

/* FLECHAS */
.flecha-nav{
    position:absolute;
    top:18px;
    display:flex;
    align-items:center;
    gap:6px;
    font-size:16px;
    color:#9e9e9e;
    cursor:pointer;
    user-select:none;
    transition:0.2s;
}

.flecha-nav:hover{
    color:#616161;
    transform:scale(1.05);
}

.flecha-nav span{
    font-size:22px;
}

.flecha-indice{
    left:24px;
}

.flecha-inicio{
    right:24px;
}

/* HEADERS */
.header-portada{
    margin-top:55px;
}

.header-app{
    margin-top:14px;
}

.logo-portada{
    width:360px;
}

.logo-app{
    width:150px;
}

/* TEXTOS */
h1{
    font-size:36px;
    margin:22px 0 8px 0;
}

h2{
    font-size:30px;
    margin:10px 0 6px 0;
}

.bajada{
    font-size:24px;
    margin-top:0;
}

.contador{
    font-size:18px;
    margin-top:4px;
}

/* MAIN */
.main{
    flex:1;
    width:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:5px 0;
}

/* CINTA */
.cinta{
    display:grid;
    grid-template-columns: repeat(10,90px);
    justify-content:center;
    margin-top:20px;
}

.casilla{
    width:90px;
    height:90px;
    border:2px solid #1f3b57;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    background:white;
    cursor:pointer;
}

.activa{
    background:#f6e7a1;
}

.correcto{
    background:#cfe9cf !important;
}

.incorrecto{
    background:#f6caca !important;
}

/* BANCO */
.banco{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin-top:30px;
}

.tarjeta{
    width:80px;
    height:80px;
    background:#f6e7a1;
    border-radius:10px;
    font-size:26px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:grab;
    border:2px solid #d4c27a;
}

/* FOOTER */
.footer{
    width:100%;
    min-height:90px;
    padding:5px 0 20px 0;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
}

.boton{
    padding:14px 28px;
    font-size:20px;
    background:#4CAF50;
    color:white;
    border:none;
    border-radius:12px;
    cursor:pointer;
}

@media (max-height:750px){
    .logo-app{
        width:120px;
    }

    h2{
        font-size:26px;
        margin:6px 0 4px 0;
    }

    .contador{
        font-size:16px;
    }

    .cinta{
        grid-template-columns: repeat(10,78px);
        margin-top:10px;
    }

    .casilla{
        width:78px;
        height:78px;
        font-size:26px;
    }

    .tarjeta{
        width:70px;
        height:70px;
        font-size:24px;
    }

    .banco{
        margin-top:22px;
    }

    .footer{
        min-height:75px;
        padding-bottom:12px;
    }
}
</style>
</head>

<body>

<div id="pantalla"></div>

<script>

/* NAVEGACIÓN */
function volverIndice(){
    window.location.href = "index_kinder.html";
}

function volverInicio(){
    portada();
}

/* VOZ */
function hablar(texto){
    let m = new SpeechSynthesisUtterance(texto);
    m.lang = "es-CL";
    let voces = speechSynthesis.getVoices();
    let voz = voces.find(v => v.lang === "es-CL") || voces.find(v => v.lang.startsWith("es"));
    if(voz) m.voice = voz;
    speechSynthesis.cancel();
    speechSynthesis.speak(m);
}

let ejercicio = 0;
let total = 6;

let nivel = 1;
let orden = [];
let indiceActual = 0;

let respuestas = Array(10).fill(null);
let modoLibre = false;

let numeroArrastrado = null;
let tarjetaActual = null;

/* PORTADA */
function portada(){
    speechSynthesis.cancel();

    document.getElementById("pantalla").innerHTML = `
        <div class="wrapper">

            <div class="flecha-nav flecha-indice" onclick="volverIndice()">
                <span>←</span> Índice
            </div>

            <div class="header-portada">
                <img src="logo.png" class="logo-portada">
                <h1>¿Completemos la cinta numerada?</h1>
                <div class="bajada">Completar secuencia numérica hasta 10 · Parte 2</div>
            </div>

            <div class="main"></div>

            <div class="footer">
                <button class="boton" onclick="nuevoEjercicio()">Iniciar</button>
            </div>
        </div>
    `;
}

/* NUEVO */
function nuevoEjercicio(){

    ejercicio++;
    modoLibre = false;

    if(ejercicio > total){
        final();
        return;
    }

    nivel = ejercicio <= 3 ? 1 : 2;

    respuestas = Array(10).fill(null);

    let fijos = nivel === 1 ? [1,5,10] : [1,10];
    fijos.forEach(n=> respuestas[n-1]=n);

    orden = [];
    for(let i=1;i<=10;i++){
        if(!fijos.includes(i)) orden.push(i-1);
    }

    orden.sort(()=>Math.random()-0.5);
    indiceActual = 0;

    document.getElementById("pantalla").innerHTML = `
        <div class="wrapper">

            <div class="flecha-nav flecha-indice" onclick="volverIndice()">
                <span>←</span> Índice
            </div>

            <div class="flecha-nav flecha-inicio" onclick="volverInicio()">
                <span>↻</span> Inicio
            </div>

            <div class="header-app">
                <img src="logo.png" class="logo-app">
                <h2>Completa la cinta numerada.</h2>
                <div class="contador">Ejercicio ${ejercicio} de ${total}</div>
            </div>

            <div class="main">
                <div id="cinta" class="cinta"></div>
                <div id="banco" class="banco"></div>
            </div>

            <div class="footer">
                <button class="boton" onclick="verificar()">Verificar</button>
            </div>

        </div>
    `;

    dibujarCinta();
    dibujarBanco();
    marcarCasilla();
}

/* CINTA */
function dibujarCinta(){

    let cinta = document.getElementById("cinta");
    cinta.innerHTML="";

    for(let i=0;i<10;i++){

        let c = document.createElement("div");
        c.className="casilla";

        c.ondragover = (e)=> e.preventDefault();

        c.ondrop = ()=>{
            colocarEnCasilla(i);
        };

        /* DEVOLVER TARJETA AL HACER CLICK */
        c.onclick = ()=>{
            if(respuestas[i] != null){

                let fijos = nivel === 1 ? [1,5,10] : [1,10];
                if(fijos.includes(respuestas[i])) return;

                devolverAlBanco(respuestas[i]);
                respuestas[i] = null;

                if(!modoLibre){
                    indiceActual--;
                    if(indiceActual < 0) indiceActual = 0;
                }

                dibujarCinta();
                marcarCasilla();
            }
        };

        if(respuestas[i]!=null){
            c.innerText = respuestas[i];
            c.style.background="#f6e7a1";
        }

        cinta.appendChild(c);
    }
}

/* BANCO */
function dibujarBanco(){

    let banco = document.getElementById("banco");
    banco.innerHTML="";

    let fijos = nivel === 1 ? [1,5,10] : [1,10];

    let nums=[];
    for(let i=1;i<=10;i++){
        if(!fijos.includes(i)) nums.push(i);
    }

    nums.sort(()=>Math.random()-0.5);

    nums.forEach(n=>{
        let t = document.createElement("div");
        t.className="tarjeta";
        t.innerText=n;
        t.draggable = true;

        t.ondragstart = ()=>{
            numeroArrastrado = n;
            tarjetaActual = t;
        };

        banco.appendChild(t);
    });
}

/* MARCAR */
function marcarCasilla(){

    if(modoLibre) return;

    let casillas = document.querySelectorAll(".casilla");
    casillas.forEach(c=>c.classList.remove("activa"));

    if(indiceActual < orden.length){
        casillas[orden[indiceActual]].classList.add("activa");
    }
}

/* COLOCAR */
function colocarEnCasilla(pos){

    if(numeroArrastrado === null) return;

    if(!modoLibre){
        if(pos !== orden[indiceActual]) return;
        respuestas[pos] = numeroArrastrado;
        indiceActual++;
    }else{
        if(respuestas[pos] !== null) return;
        respuestas[pos] = numeroArrastrado;
    }

    if(tarjetaActual) tarjetaActual.remove();

    numeroArrastrado = null;
    tarjetaActual = null;

    dibujarCinta();
    marcarCasilla();
}

/* VERIFICAR */
function verificar(){

    let casillas = document.querySelectorAll(".casilla");
    let todoBien=true;

    for(let i=0;i<10;i++){

        if(respuestas[i]!=null){

            if(respuestas[i]==i+1){
                casillas[i].classList.add("correcto");
            }else{
                casillas[i].classList.add("incorrecto");

                devolverAlBanco(respuestas[i]);
                respuestas[i]=null;

                todoBien=false;
            }
        }
    }

    if(todoBien){
        hablar("Muy bien, completaste la cinta");
        setTimeout(nuevoEjercicio,1500);
    }else{
        hablar("Inténtalo otra vez");
        modoLibre = true;
        dibujarCinta();
    }
}

/* DEVOLVER */
function devolverAlBanco(num){

    let banco = document.getElementById("banco");

    let t = document.createElement("div");
    t.className="tarjeta";
    t.innerText=num;
    t.draggable=true;

    t.ondragstart = ()=>{
        numeroArrastrado = num;
        tarjetaActual = t;
    };

    banco.appendChild(t);
}

/* FINAL */
function final(){
    document.getElementById("pantalla").innerHTML = `
        <div class="wrapper">

            <div class="flecha-nav flecha-indice" onclick="volverIndice()">
                <span>←</span> Índice
            </div>

            <div class="flecha-nav flecha-inicio" onclick="volverInicio()">
                <span>↻</span> Inicio
            </div>

            <div class="header-portada">
                <img src="logo.png" class="logo-portada">
                <h1>¡Muy bien!</h1>
                <div class="bajada">Completaste todas las cintas</div>
            </div>

            <div class="main"></div>

            <div class="footer">
                <button class="boton" onclick="portada()">Volver</button>
            </div>
        </div>
    `;
}

portada();

</script>

</body>
</html>
