<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calcumat Kinder – ¿Cuántas hay en la cinta?</title>

<style>

body{
    font-family:'Comic Sans MS','Trebuchet MS',sans-serif;
    margin:0;
    text-align:center;
    background:white;
}

/* CONTENEDOR */
.wrapper{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
}

/* FLECHAS */
.flecha-nav{
    position:absolute;
    top:18px;
    display:flex;
    align-items:center;
    gap:6px;
    font-size:16px;
    color:#9e9e9e;
    cursor:pointer;
    user-select:none;
    transition:0.2s;
}

.flecha-nav:hover{
    color:#616161;
    transform:scale(1.05);
}

.flecha-nav span{
    font-size:22px;
}

.flecha-indice{
    left:24px;
}

.flecha-inicio{
    right:24px;
}

/* HEADERS */
.header-portada{
    margin-top:55px;
}

.header-app{
    margin-top:14px;
}

.logo-portada{
    width:360px;
}

.logo-app{
    width:150px;
}

/* TEXTOS */
h1{
    font-size:36px;
    margin:22px 0 8px 0;
}

h2{
    font-size:30px;
    margin:10px 0 6px 0;
}

.bajada{
    font-size:24px;
    margin-top:0;
}

.contador{
    font-size:18px;
    margin-top:4px;
}

/* MAIN */
.main{
    flex:1;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:5px 0;
}

/* FILA PUNTOS */
.fila-puntos{
    display:grid;
    grid-template-columns: repeat(10,90px);
    justify-content:center;
    margin-bottom:10px;
}

/* PUNTOS */
.punto{
    width:65px;
    height:65px;
    background:#f44336;
    border-radius:50%;
    margin:auto;
}

/* CINTA */
.cinta{
    display:grid;
    grid-template-columns: repeat(10,90px);
}

/* CASILLA */
.casilla{
    width:90px;
    height:80px;
    border:3px solid #0d2b45;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    position:relative;
}

/* CÍRCULO VERDE */
.correcto::after{
    content:"";
    position:absolute;
    width:60px;
    height:60px;
    border:4px solid #4CAF50;
    border-radius:50%;
}

/* FOOTER */
.footer{
    width:100%;
    min-height:90px;
    padding:5px 0 20px 0;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
}

.boton{
    padding:14px 28px;
    font-size:20px;
    background:#4CAF50;
    color:white;
    border:none;
    border-radius:12px;
    cursor:pointer;
}

.reloj{
    font-size:56px;
}

.oculto{
    visibility:hidden;
}

@media (max-height:750px){
    .logo-app{
        width:120px;
    }

    h2{
        font-size:26px;
        margin:6px 0 4px 0;
    }

    .contador{
        font-size:16px;
    }

    .fila-puntos{
        grid-template-columns: repeat(10,78px);
    }

    .cinta{
        grid-template-columns: repeat(10,78px);
    }

    .casilla{
        width:78px;
        height:70px;
        font-size:26px;
    }

    .punto{
        width:55px;
        height:55px;
    }

    .footer{
        min-height:75px;
        padding-bottom:12px;
    }
}

</style>
</head>

<body>

<div id="app"></div>

<script>

/* NAVEGACIÓN */
function volverIndice(){
    window.location.href = "index_kinder.html";
}

function volverInicio(){
    mostrarPortada();
}

/* VOZ */
function hablar(texto){
    let m = new SpeechSynthesisUtterance(texto);
    m.lang = "es-CL";
    let voz = speechSynthesis.getVoices().find(v => v.lang.includes("es"));
    if(voz) m.voice = voz;
    speechSynthesis.cancel();
    speechSynthesis.speak(m);
}

let cantidad = 0;
let ejercicio = 0;
let total = 20;

/* GENERAR */
function generarCantidad(){
    return Math.floor(Math.random()*10)+1;
}

/* PORTADA */
function mostrarPortada(){
    speechSynthesis.cancel();

    document.getElementById("app").innerHTML = `
        <div class="wrapper">

            <div class="flecha-nav flecha-indice" onclick="volverIndice()">
                <span>←</span> Índice
            </div>

            <div class="header-portada">
                <img src="logo.png" class="logo-portada">
                <h1>¿Cuántas hay en la cinta?</h1>
                <div class="bajada">Cuantificar en la cinta numerada hasta 10 · Parte 1</div>
            </div>

            <div class="main"></div>

            <div class="footer">
                <button class="boton" onclick="iniciar()">Iniciar</button>
            </div>

        </div>
    `;
}

/* INICIO */
function iniciar(){
    ejercicio = 0;
    nuevoEjercicio();
}

/* NUEVO */
function nuevoEjercicio(){

    ejercicio++;

    if(ejercicio > total){
        mostrarFinal();
        return;
    }

    cantidad = generarCantidad();

    document.getElementById("app").innerHTML = `
        <div class="wrapper">

            <div class="flecha-nav flecha-indice" onclick="volverIndice()">
                <span>←</span> Índice
            </div>

            <div class="flecha-nav flecha-inicio" onclick="volverInicio()">
                <span>↻</span> Inicio
            </div>

            <div class="header-app">
                <img src="logo.png" class="logo-app">
                <h2>¿Cuántas hay?</h2>
                <div class="contador">Ejercicio ${ejercicio} de ${total}</div>
            </div>

            <div class="main">

                <div id="puntos"></div>
                <div id="cinta"></div>

            </div>

            <div id="footer" class="footer">
                <button class="boton" onclick="iniciarEjercicio()">Iniciar ejercicio</button>
            </div>

        </div>
    `;
}

/* INICIAR */
function iniciarEjercicio(){

    let puntos = document.getElementById("puntos");
    let cinta = document.getElementById("cinta");

    puntos.className = "fila-puntos";
    cinta.className = "cinta";

    puntos.innerHTML = "";
    cinta.innerHTML = "";

    for(let i=1;i<=10;i++){

        let cont = document.createElement("div");

        if(i <= cantidad){
            let p = document.createElement("div");
            p.className = "punto";
            cont.appendChild(p);
        }

        puntos.appendChild(cont);

        let cas = document.createElement("div");
        cas.className = "casilla";
        cas.id = "num"+i;
        cas.innerText = i;

        cinta.appendChild(cas);
    }

    document.getElementById("footer").innerHTML = `<div class="reloj">⏳</div>`;

    setTimeout(ocultarTodo,3000);
}

/* OCULTAR */
function ocultarTodo(){

    document.getElementById("puntos").classList.add("oculto");
    document.getElementById("cinta").classList.add("oculto");

    document.getElementById("footer").innerHTML = `
        <button class="boton" onclick="mostrarRespuesta()">Verificar</button>
    `;
}

/* VERIFICAR */
function mostrarRespuesta(){

    document.getElementById("puntos").classList.remove("oculto");
    document.getElementById("cinta").classList.remove("oculto");

    let correcto = document.getElementById("num"+cantidad);
    correcto.classList.add("correcto");

    hablar("Hay " + cantidad);

    document.getElementById("footer").innerHTML = `
        <button class="boton" onclick="nuevoEjercicio()">Siguiente</button>
    `;
}

/* FINAL */
function mostrarFinal(){

    document.getElementById("app").innerHTML = `
        <div class="wrapper">

            <div class="flecha-nav flecha-indice" onclick="volverIndice()">
                <span>←</span> Índice
            </div>

            <div class="flecha-nav flecha-inicio" onclick="volverInicio()">
                <span>↻</span> Inicio
            </div>

            <div class="header-portada">
                <img src="logo.png" class="logo-portada">
                <h1>¡Muy bien!</h1>
            </div>

            <div class="main"></div>

            <div class="footer">
                <button class="boton" onclick="mostrarPortada()">Volver</button>
            </div>

        </div>
    `;
}

mostrarPortada();

</script>

</body>
</html>
