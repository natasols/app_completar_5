<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calcumat – Kínder</title>

<style>

body{
    font-family:'Comic Sans MS','Trebuchet MS',sans-serif;
    margin:0;
    background:white;
}

/* CONTENEDOR */
.wrapper{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px;
}

/* LOGO */
.logo{
    width:360px;
    margin-top:30px;
    margin-bottom:20px;
}

/* TITULO */
.titulo{
    font-size:36px;
    margin-bottom:10px;
    text-align:center;
}

.bajada{
    font-size:24px;
    margin-bottom:40px;
    text-align:center;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(280px,1fr));
    gap:22px;
    width:100%;
    max-width:1000px;
}

/* TARJETA */
.tarjeta{
    background:#f9f9f9;
    border-radius:22px;
    padding:26px;
    text-align:center;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,0.08);
    transition:0.2s;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:110px;
}

.tarjeta:hover{
    transform:scale(1.04);
    box-shadow:0 6px 14px rgba(0,0,0,0.12);
}

/* TEXTO */
.nombre{
    font-size:21px;
    line-height:1.35;
}

/* RESPONSIVE */
@media (max-width:700px){

    .logo{
        width:280px;
    }

    .titulo{
        font-size:30px;
    }

    .bajada{
        font-size:20px;
    }

    .nombre{
        font-size:19px;
    }
}

</style>
</head>

<body>

<div class="wrapper">

    <img src="logo.png" class="logo">

    <div class="titulo">Calcumat Kínder</div>

    <div class="bajada">
        Rutinas matemáticas
    </div>

    <div class="grid">

        <!-- APP 1 -->
        <div class="tarjeta" onclick="ir('identificar_numeros_animales_10.html')">
            <div class="nombre">
                ¿Qué número ves?
            </div>
        </div>

        <!-- APP 2 -->
        <div class="tarjeta" onclick="ir('completar_cinta_numerada_10.html')">
            <div class="nombre">
                ¿Completemos la cinta numerada? · Parte 1
            </div>
        </div>

        <!-- APP 3 -->
        <div class="tarjeta" onclick="ir('completar_cinta_numerada_10_parte2.html')">
            <div class="nombre">
                ¿Completemos la cinta numerada? · Parte 2
            </div>
        </div>

        <!-- APP 4 PENDIENTE -->
        <!--
        <div class="tarjeta" onclick="ir('formar_dedos_hasta_10.html')">
            <div class="nombre">
                Formar números con los dedos
            </div>
        </div>
        -->

        <!-- APP 5 -->
        <div class="tarjeta" onclick="ir('cuantificar_10_cinta_descubierta.html')">
            <div class="nombre">
                ¿Cuántas hay en la cinta? · Parte 1
            </div>
        </div>

        <!-- APP 6 -->
        <div class="tarjeta" onclick="ir('cuantificar_10_cinta_cubierta.html')">
            <div class="nombre">
                ¿Cuántas hay en la cinta? · Parte 2
            </div>
        </div>

        <!-- APP 7 -->
        <div class="tarjeta" onclick="ir('cuantificar_hasta_10_marco_10.html')">
            <div class="nombre">
                ¿Cuántas hay? · Marco de 10
            </div>
        </div>

        <!-- APP 8 -->
        <div class="tarjeta" onclick="ir('app_completar_10.html')">
            <div class="nombre">
                ¿Cuántas hay? ¿Cuántas faltan?
            </div>
        </div>

    </div>

</div>

<script>

function ir(url){
    window.location.href = url;
}

</script>

</body>
</html>
